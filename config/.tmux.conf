set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Status/tab styling is owned by this file so tabs stay predictable.
# Keep heavier theme plugins disabled; they override status/window formats.
# set -g @plugin 'erikw/tmux-powerline'
# set -g @plugin 'jimeh/tmux-themepack'
# set -g @plugin 'catppuccin/tmux'
# set -g @themepack 'powerline/default/purple'
# set -g @catppuccin_flavour 'mocha'

# Top tab bar: compact, high-contrast current window, muted inactive windows.
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left-length 40
set -g status-left '#[fg=#11111b,bg=#a6e3a1,bold] #S #[fg=#a6e3a1,bg=#1e1e2e,nobold] '
set -g status-right-length 80
set -g status-right '#[fg=#6c7086]#{=32:pane_title} #[fg=#89b4fa]%H:%M #[fg=#6c7086]%d-%b-%y '

set -g window-status-separator ''
set -g window-status-format '#[fg=#7f849c,bg=#1e1e2e] #I:#{=24:window_name} '
set -g window-status-current-format '#[fg=#11111b,bg=#f9e2af,bold] #I:#{=28:window_name} #[fg=#f9e2af,bg=#1e1e2e,nobold]'
set -g window-status-activity-style 'fg=#f9e2af,bg=#1e1e2e'
set -g window-status-bell-style 'fg=#11111b,bg=#f38ba8,bold'

# Bottom detail line: native per-pane context, no git shell commands.
set -g pane-border-status bottom
set -g pane-border-lines simple
# Match border lines to the terminal background so the bottom detail line does
# not create a visible frame/margin around the whole pane.
set -g pane-border-style 'fg=#1e1e2e'
set -g pane-active-border-style 'fg=#1e1e2e'
set -g pane-border-format '#{?pane_active,#[fg=#11111b,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#313244,nobold]#[fg=#cdd6f4,bg=#313244] #I:#W · pane #P · #{pane_current_command} · #{=72:pane_current_path} · %H:%M %d-%b ,#[fg=#45475a,bg=#1e1e2e] #I:#W · pane #P }'

set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-shell /bin/zsh

# neovim required settings
set -sg escape-time 10

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Start window numbering at 1
set -g base-index 1

# Enable mouse support
set -g mouse on
set-hook -g after-new-session 'set-option mouse on'

bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Vim movements for pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim movements for window switching
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Vim movements for resizing panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Continuum - auto save/restore sessions
set -g @continuum-boot-options 'kitty,fullscreen'
set -g @continuum-restore 'on'

# Sesh - tmux session manager
set -g detach-on-destroy off  # don't exit tmux when closing a session
bind-key "T" run-shell "~/.config/sesh/picker.sh"
bind -N "last-session (via sesh)" L run-shell "sesh last"

# Memento sweeper — catch orphan Claude transcripts on session close
set-hook -g session-closed 'run-shell -b "python3 ~/.claude/hooks/memento-sweeper.py"'

# AgenticFootball worktree dashboard
# Shell commands: af-grid, af-grid-kill
# Tmux commands: prefix : af-grid, prefix : af-grid-kill
set -s command-alias[100] 'af-grid=run-shell -b "$HOME/.local/bin/af-grid"'
set -s command-alias[101] 'af-grid-kill=run-shell -b "$HOME/.local/bin/af-grid-kill"'
bind-key -N "start AgenticFootball worktree grid" G run-shell -b "$HOME/.local/bin/af-grid"
bind-key -N "kill AgenticFootball worktree grid" C-g confirm-before -p "Kill af-grid dashboard? (y/n)" 'run-shell -b "$HOME/.local/bin/af-grid-kill"'

# Initialize TMUX plugin manager when installed (keep this line at the very bottom of tmux.conf)
if-shell -b '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'

