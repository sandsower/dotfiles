worktree-path = "{{ repo_path }}/{{ branch | sanitize }}"

[post-create]
update-main = """
git fetch origin {{ default_branch }}
git rebase origin/{{ default_branch }} 2>/dev/null || git rebase --abort 2>/dev/null || true
"""

# Keep secret/config propagation opt-in and repo-local.
# Do not symlink .env*, agent config, workflow state, local E2E folders,
# node_modules, or other runtime state from the primary worktree by default.
# Those conveniences should be recreated only as trusted per-repo setup or a
# private local overlay because they can carry credentials, local permissions,
# or shared mutable package state into branches that should stay isolated.
